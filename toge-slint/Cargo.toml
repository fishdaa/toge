[package]
name = "toge-slint"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
toge-core.workspace = true
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-skia-opengl", "compat-1-2"] }
time = { version = "0.3", features = ["formatting"] }

[build-dependencies]
slint-build = "=1.17.1"

[dev-dependencies]
tempfile = "3"
