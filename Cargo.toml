[workspace]
members = ["toge-core", "toged", "toge", "toge-slint"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["fishdaa <git@fishda.net>"]
license = "Apache-2.0"
repository = "https://github.com/fishdaa/needle"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are documentation or naming noise for this codebase.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
struct_field_names = "allow"
similar_names = "allow"
too_many_lines = "allow"

[workspace.dependencies]
toge-core = { package = "toge-core", version = "0.2.0", path = "toge-core" }

# Slint's renderer leans on pure-Rust text shaping and rasterization that is
# unusably slow without optimizations; unoptimized dependency code is what
# turns a normal result-list repaint into a 300ms+ UI freeze in dev builds.
[profile.dev.package."*"]
opt-level = 2
